[project]
name = "ova-agentic-flow-copier"
version = "0.1.0"
description = "A copier template for generating new Python projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_work"]

[project.scripts]
agent-work = "agent_work.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["template"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--ignore=template",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff.lint]
ignore = ["E501", "G004", "D203", "D213", "COM812", "S603"]
exclude = ["*project_slug*"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "EXE", "SLF001", "PLR0913"]
# T201: these helpers are CLI scripts that write to stdout/stderr by design
"tests/helpers/*.py" = ["T201"]
"template/tests/helpers/*.py" = ["T201"]

[tool.tox]
requires = ["tox>=4.19", "tox-uv>=1.20"]
env_list = ["py311", "py314"]

[tool.tox.env.py311]
description = "Run tests with Python 3.11"
set_env = { COVERAGE_FILE = ".coverage.py311" }
deps = [
    "hypothesis>=6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=3.15.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
commands = [["pytest", "-v", "--cov", "--cov-fail-under=85", "--cov-report=xml:coverage-py311.xml", "--cov-report=html:htmlcov/py311", "--junitxml=test-results-py311.xml"]]

[tool.tox.env.py314]
description = "Run tests with Python 3.14"
set_env = { COVERAGE_FILE = ".coverage.py314" }
deps = [
    "hypothesis>=6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=3.15.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
commands = [["pytest", "-v", "--cov", "--cov-fail-under=85", "--cov-report=xml:coverage-py314.xml", "--cov-report=html:htmlcov/py314", "--junitxml=test-results-py314.xml"]]

[dependency-groups]
test = [
    "hypothesis>=6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=3.15.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
dev = [
    {include-group = "test"},
    "kingfisher-bin>=1.112.0",
    "pre-commit>=4.6.2",
    "ty>=0.0.1a11",
    "yamllint>=1.37.1",
    "ruff>=0.16.4",
    "tox>=4.27.0",
    "tox-uv>=1.20",
]
