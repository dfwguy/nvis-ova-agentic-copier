[project]
name = "breese-copier"
version = "0.1.0"
description = "A copier template for generating new Python projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breese_copier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["E501", "G004", "D203", "D213", "COM812", "S603"]
exclude = ["*project_slug*"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "EXE", "SLF001", "PLR0913"]

[tool.tox]
requires = ["tox>=4.19", "tox-uv>=1.20"]
env_list = ["py311", "py314"]

[tool.tox.env.py311]
description = "Run tests with Python 3.11"
deps = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
commands = [["pytest", "-v", "--junitxml=test-results.xml"]]

[tool.tox.env.py314]
description = "Run tests with Python 3.14"
deps = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
commands = [["pytest", "-v", "--junitxml=test-results.xml"]]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.2.0",
    "copier>=9.0.0",
]
dev = [
    {include-group = "test"},
    "ty>=0.0.1a11",
    "yamllint>=1.37.1",
    "ruff>=0.15.10",
    "tox>=4.27.0",
]
