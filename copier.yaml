_subdirectory: template

_skip_if_exists:
  - pyproject.toml
  - README.md
  - .gitlab-ci.yml
  - .pre-commit-config.yaml
  - .agents/project.md
  - .claude/project.md
  - "src/{{ project_slug }}/__init__.py"

message_before_update: |-
  This template uses src/<package>/ for Python code. If your project still has
  a legacy flat <package>/ directory, stop and migrate it before continuing:
  move the package to src/<package>/, update pyproject.toml, and run the
  project checks. Do not accept an update that leaves both package paths.

_tasks:
  - |-
    missing=0
    if ! command -v git >/dev/null 2>&1; then
      printf 'Missing required command: git\n' >&2
      missing=1
    fi
    if ! command -v uv >/dev/null 2>&1; then
      printf 'Missing required command: uv\n' >&2
      missing=1
    fi
    if ! command -v glab >/dev/null 2>&1; then
      printf 'Missing required command: glab\n' >&2
      missing=1
    fi
    if [ "$missing" -ne 0 ]; then
      printf 'Resolve every prerequisite above, then rerun Copier.\n' >&2
      exit 1
    fi
  - git init
  - |-
    if [ -L .claude/skills ]; then
      if [ "$(command -p readlink .claude/skills)" != ../.agents/skills ]; then
        printf 'Cannot link Claude Code skills: .claude/skills does not point to ../.agents/skills. Preserve the existing link, then rerun Copier.\n' >&2
        exit 1
      fi
    elif ! git diff --no-index --quiet -- .claude/skills .agents/skills; then
      printf 'Cannot link Claude Code skills: .claude/skills differs from .agents/skills. Preserve any local changes, then rerun Copier.\n' >&2
      exit 1
    else
      command -p rm -r .claude/skills
      command -p ln -s ../.agents/skills .claude/skills
    fi
    legacy_project_guard='<!-- agent-workflow-legacy-project-guard -->'
    if [ -f .claude/project.md ]; then
      if [ "$(command -p cat .claude/project.md)" = "$legacy_project_guard" ]; then
        command -p rm .claude/project.md
      else
        printf 'Legacy project context remains at .claude/project.md. Reconcile it into .agents/project.md, remove the legacy file, then rerun Copier.\n' >&2
      fi
    fi
  - |-
    if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1; then
      printf 'Warning: Git cannot resolve an author identity. Configure this directory or set GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL.\n' >&2
    fi
    gitlab_host="${GITLAB_HOST:-gitlab-master.nvidia.com}"
    if ! glab api --hostname "$gitlab_host" user >/dev/null 2>&1; then
      printf 'Warning: glab cannot access %s. Configure a scoped token or sign in before GitLab workflow actions.\n' "$gitlab_host" >&2
    fi
  - uv sync
  - uv run pre-commit install

project_name:
  type: str
  help: Human-readable project name
  default: My Python Project

project_slug:
  type: str
  help: Python package name (auto-derived from project_name)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

description:
  type: str
  help: Short project description
  default: A Python project generated with copier
