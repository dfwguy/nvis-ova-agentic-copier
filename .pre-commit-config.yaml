repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: "uv run yamllint --config-data='{extends: default, rules: {line-length: disable, document-start: disable}}'"
        language: system
        types: [yaml]
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: tox
        name: tox
        entry: uv run tox run-parallel
        language: system
        pass_filenames: false
        types: [python]
