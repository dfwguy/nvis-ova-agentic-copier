stages:
  - ci-image
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.ci_image_builder:
  stage: ci-image
  interruptible: true
  image:
    name: docker.io/moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p /tmp/ci-image-context
    - cp Dockerfile pyproject.toml uv.lock /tmp/ci-image-context/

ci-image:candidate:
  extends: .ci_image_builder
  tags:
    - size/medium
  before_script:
    - !reference [.ci_image_builder, before_script]
    - mkdir -p "$HOME/.docker"
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$auth" \
        > "$HOME/.docker/config.json"
      unset auth
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE" \
        --metadata-file build-metadata.json \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/validation-cache" \
        --export-cache "type=registry,ref=$CI_REGISTRY_IMAGE/validation-cache,mode=max" \
        --output "type=image,name=$CI_REGISTRY_IMAGE/validation:$CI_COMMIT_SHA-$CI_PIPELINE_ID,push=true"
    - |
      digest="$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' build-metadata.json)"
      printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf 'CI_IMAGE=%s/validation@%s\n' "$CI_REGISTRY_IMAGE" "$digest" \
        > ci-image.env
  artifacts:
    reports:
      dotenv: ci-image.env
    paths:
      - build-metadata.json
      - ci-image.env
    when: always
.base_uv:
  stage: validate
  interruptible: true
  needs:
    - job: ci-image:candidate
      artifacts: false
  tags:
    - size/medium
  image:
    name: $CI_REGISTRY_IMAGE/validation:$CI_COMMIT_SHA-$CI_PIPELINE_ID
  before_script:
    - cd "$CI_PROJECT_DIR"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

ruff-check:
  extends: .base_uv
  script:
    - uv run --no-sync ruff check --output-format=gitlab . > ruff-code-quality-report.json
  artifacts:
    reports:
      codequality: ruff-code-quality-report.json
    when: always

ruff-format:
  extends: .base_uv
  script:
    - uv run --no-sync ruff format --check --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

.pytest:
  extends: .base_uv
  script:
    - |
      case "$TEST_ENVIRONMENT" in
          py311) python_environment="$CI_PY311_ENVIRONMENT" ;;
          py314) python_environment="$CI_PY314_ENVIRONMENT" ;;
          *) printf 'Unknown test environment: %s\n' "$TEST_ENVIRONMENT" >&2; exit 2 ;;
      esac
      if [[ ! "$CI_NODE_INDEX" =~ ^[1-4]$ ]] || [[ "$CI_NODE_TOTAL" != 4 ]]; then
          printf 'Invalid GitLab parallel metadata: index=%s total=%s\n' \
              "$CI_NODE_INDEX" "$CI_NODE_TOTAL" >&2
          exit 2
      fi
      shard_index=$((CI_NODE_INDEX - 1))
      PYTHONPATH="$CI_PROJECT_DIR:$CI_PROJECT_DIR/src" \
          COVERAGE_FILE=".coverage.$TEST_ENVIRONMENT-shard-$CI_NODE_INDEX" \
          UV_PROJECT_ENVIRONMENT="$python_environment" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
              --cov=src/agent_work \
              --junitxml="test-results-$TEST_ENVIRONMENT-shard-$CI_NODE_INDEX.xml" \
              -o "junit_suite_name=$TEST_ENVIRONMENT" \
              -o "cache_dir=.cache/pytest/$TEST_ENVIRONMENT/shard-$CI_NODE_INDEX" \
          -p tests.helpers.serial_runtime_shard \
          --serial-runtime-shard-index="$shard_index" \
          --serial-runtime-shard-count=4
  artifacts:
    reports:
      junit: test-results-$TEST_ENVIRONMENT-shard-$CI_NODE_INDEX.xml
    paths:
      - .coverage.$TEST_ENVIRONMENT-shard-$CI_NODE_INDEX
    when: always

.pytest_coverage:
  extends: .base_uv
  script:
    - |
      case "$TEST_ENVIRONMENT" in
          py311) python_environment="$CI_PY311_ENVIRONMENT" ;;
          py314) python_environment="$CI_PY314_ENVIRONMENT" ;;
          *) printf 'Unknown test environment: %s\n' "$TEST_ENVIRONMENT" >&2; exit 2 ;;
      esac
      coverage_combine_status=0
      UV_PROJECT_ENVIRONMENT="$python_environment" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT coverage combine \
              ".coverage.$TEST_ENVIRONMENT-shard-1" \
              ".coverage.$TEST_ENVIRONMENT-shard-2" \
              ".coverage.$TEST_ENVIRONMENT-shard-3" \
              ".coverage.$TEST_ENVIRONMENT-shard-4" \
          || coverage_combine_status=$?
      if [ "$coverage_combine_status" -ne 0 ]; then
          exit "$coverage_combine_status"
      fi
      coverage_status=0
      UV_PROJECT_ENVIRONMENT="$python_environment" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT coverage report --fail-under=85 \
          || coverage_status=$?
      coverage_xml_status=0
      UV_PROJECT_ENVIRONMENT="$python_environment" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT coverage xml -o "coverage-$TEST_ENVIRONMENT.xml" \
          || coverage_xml_status=$?
      if [ "$coverage_status" -ne 0 ]; then
          exit "$coverage_status"
      fi
      exit "$coverage_xml_status"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-$TEST_ENVIRONMENT.xml
    paths:
      - coverage-$TEST_ENVIRONMENT.xml
    when: always

pytest-py311:
  extends: .pytest
  parallel: 4
  variables:
    TEST_ENVIRONMENT: py311

pytest-py314:
  extends: .pytest
  parallel: 4
  variables:
    TEST_ENVIRONMENT: py314

coverage-py311:
  extends: .pytest_coverage
  needs:
    - job: ci-image:candidate
      artifacts: false
    - job: pytest-py311
      artifacts: true
  variables:
    TEST_ENVIRONMENT: py311

coverage-py314:
  extends: .pytest_coverage
  needs:
    - job: ci-image:candidate
      artifacts: false
    - job: pytest-py314
      artifacts: true
  variables:
    TEST_ENVIRONMENT: py314

yamllint:
  extends: .base_uv
  script:
    - |
      uv run --no-sync yamllint \
          -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' \
          -f parsable . \
          | uv run --no-sync python tests/helpers/yamllint_to_json.py \
              > yamllint-code-quality-report.json
  artifacts:
    reports:
      codequality: yamllint-code-quality-report.json
    when: always

kingfisher:
  extends: .base_uv
  script:
    - uv run --no-sync kingfisher scan . --git-history none --no-validate --no-update-check --exclude .git --exclude .cache --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type-check:
  extends: .base_uv
  script:
    - uv run --no-sync ty check

license-check:
  extends: .base_uv
  script:
    - uv run --no-sync python scripts/check_licenses.py --root .

readability-check:
  extends: .base_uv
  script:
    - uv run --locked --all-groups python -m agent_work.readability --root . --scope all

shellcheck:
  extends: .base_uv
  script:
    - |
      file_list=$(mktemp)
      trap 'rm -f "$file_list"' 0 HUP INT TERM
      find . -type f \
          -not -path './.git/*' \
          -not -path './.cache/*' \
          -not -path './.venv/*' \
          -not -path './.tox/*' \
          -not -path './.pytest_cache/*' \
          -not -path './.ruff_cache/*' \
          -print0 > "$file_list"
      status=0
      while IFS= read -r -d '' file; do
          case "$file" in
              *.sh) shellcheck "$file" || status=1 ;;
              *)
                  IFS= read -r first_line < "$file" || true
                  if [[ "$first_line" =~ ^#!.*(ba)?sh ]]; then
                      shellcheck "$file" || status=1
                  fi
                  ;;
          esac
      done < "$file_list"
      exit "$status"
