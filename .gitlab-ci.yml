stages:
  - ci-image
  - validate

.ci_image_builder:
  stage: ci-image
  interruptible: true
  image:
    name: docker.io/moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p /tmp/ci-image-context
    - cp Dockerfile pyproject.toml uv.lock /tmp/ci-image-context/

ci-image:validate:
  extends: .ci_image_builder
  tags:
    - size/medium
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - Dockerfile
          - pyproject.toml
          - uv.lock
    - when: never

ci-image:publish:
  extends: .ci_image_builder
  tags:
    - size/medium
  before_script:
    - !reference [.ci_image_builder, before_script]
    - mkdir -p "$HOME/.docker"
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$auth" \
        > "$HOME/.docker/config.json"
      unset auth
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE" \
        --metadata-file build-metadata.json \
        --output "type=image,name=$CI_REGISTRY_IMAGE/validation:$CI_COMMIT_SHA,push=true"
    - |
      digest="$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' build-metadata.json)"
      printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf 'CI_IMAGE=%s/validation@%s\n' "$CI_REGISTRY_IMAGE" "$digest" \
        > ci-image.env
  artifacts:
    reports:
      dotenv: ci-image.env
    paths:
      - build-metadata.json
      - ci-image.env
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - Dockerfile
          - pyproject.toml
          - uv.lock
    - when: never

.base_job:
  stage: validate
  interruptible: true
  tags:
    - size/medium
  rules:
    - if: $CI_COMMIT_BRANCH

.base_uv:
  extends: .base_job
  image:
    name: ghcr.io/astral-sh/uv:0.9.30-python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  before_script:
    - &ci_project_directory cd "$CI_PROJECT_DIR"
    - &uv_version uv --version

.base_py311:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" uv sync --locked --all-groups --python 3.11 --no-managed-python

ruff-check:
  extends: .base_py311
  script:
    - uv run --no-sync ruff check --output-format=gitlab . > ruff-code-quality-report.json
  artifacts:
    reports:
      codequality: ruff-code-quality-report.json
    when: always

ruff-format:
  extends: .base_py311
  script:
    - uv run --no-sync ruff format --check --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

pytest-py311:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - apt-get update -qq && apt-get install -y --no-install-recommends git jq
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" uv sync --locked --all-groups --python 3.11 --no-managed-python
  script:
    - |
      COVERAGE_FILE=".coverage.py311" \
          UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
              --cov \
              --cov-fail-under=85 \
              --cov-report=xml:coverage-py311.xml \
              --junitxml=test-results-py311.xml \
              -o junit_suite_name=py311 \
              -o cache_dir=.cache/pytest/py311
  artifacts:
    reports:
      junit: test-results-py311.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py311.xml
    when: always

pytest-py314:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - |
      set -Eeuo pipefail
      apt_status=0
      python_status=0

      uv python install 3.14.3 --managed-python &
      python_install_pid=$!

      apt-get update -qq \
          && apt-get install -y --no-install-recommends git jq \
          || apt_status=$?

      wait "$python_install_pid" || python_status=$?

      if (( apt_status != 0 )); then
          exit "$apt_status"
      fi
      if (( python_status != 0 )); then
          exit "$python_status"
      fi
    - UV_PROJECT_ENVIRONMENT="/tmp/ci-venvs/py314" uv sync --locked --all-groups --python 3.14.3 --managed-python
  script:
    - |
      COVERAGE_FILE=".coverage.py314" \
          UV_PROJECT_ENVIRONMENT="/tmp/ci-venvs/py314" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
              --cov \
              --cov-fail-under=85 \
              --cov-report=xml:coverage-py314.xml \
              --junitxml=test-results-py314.xml \
              -o junit_suite_name=py314 \
              -o cache_dir=.cache/pytest/py314
  artifacts:
    reports:
      junit: test-results-py314.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py314.xml
    when: always

yamllint:
  extends: .base_py311
  script:
    - |
      uv run --no-sync yamllint \
          -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' \
          -f parsable . \
          | uv run --no-sync python tests/helpers/yamllint_to_json.py \
              > yamllint-code-quality-report.json
  artifacts:
    reports:
      codequality: yamllint-code-quality-report.json
    when: always

kingfisher:
  extends: .base_py311
  script:
    - uv run --no-sync kingfisher scan . --git-history none --no-validate --no-update-check --exclude .git --exclude .cache --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type-check:
  extends: .base_py311
  script:
    - uv run --no-sync ty check

shellcheck:
  extends: .base_job
  image:
    name: docker.io/koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    entrypoint: [""]
  script:
    - shellcheck --version
    - echo "Linting all shell scripts"
    - |
      file_list=$(mktemp)
      trap 'rm -f "$file_list"' 0 HUP INT TERM
      if ! find . -type f \
          -not -path './.git/*' \
          -not -path './.cache/*' \
          -not -path './.venv/*' \
          -not -path './.tox/*' \
          -not -path './.pytest_cache/*' \
          -not -path './.ruff_cache/*' \
          -print0 > "$file_list"; then
          exit 1
      fi
      xargs -0 -r sh -c '
          status=0
          for file do
              case "$file" in
                  *.sh)
                      shellcheck "$file" || status=1
                      ;;
                  *)
                      if head -n1 "$file" | grep -Eq "^#!.*(ba)?sh"; then
                          shellcheck "$file" || status=1
                      fi
                      ;;
              esac
          done
          exit "$status"
      ' _ < "$file_list"
