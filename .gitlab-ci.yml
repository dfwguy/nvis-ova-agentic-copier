stages:
  - ci-image
  - build

.ci_image_builder:
  stage: ci-image
  interruptible: true
  image:
    name: docker.io/moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p /tmp/ci-image-context
    - cp Dockerfile pyproject.toml uv.lock /tmp/ci-image-context/

ci-image:validate:
  extends: .ci_image_builder
  tags:
    - size/medium
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - Dockerfile
          - pyproject.toml
          - uv.lock
    - when: never

ci-image:publish:
  extends: .ci_image_builder
  tags:
    - size/medium
  before_script:
    - !reference [.ci_image_builder, before_script]
    - mkdir -p "$HOME/.docker"
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$auth" \
        > "$HOME/.docker/config.json"
      unset auth
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE" \
        --metadata-file build-metadata.json \
        --output "type=image,name=$CI_REGISTRY_IMAGE/validation:$CI_COMMIT_SHA,push=true"
    - |
      digest="$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' build-metadata.json)"
      printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf 'CI_IMAGE=%s/validation@%s\n' "$CI_REGISTRY_IMAGE" "$digest" \
        > ci-image.env
  artifacts:
    reports:
      dotenv: ci-image.env
    paths:
      - build-metadata.json
      - ci-image.env
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - Dockerfile
          - pyproject.toml
          - uv.lock
    - when: never

.uv_cache:
  cache: &uv_cache
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/

.base_uv:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:0.7.3-python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  before_script:
    - cd $CI_PROJECT_DIR
    - uv --version
  rules:
    - if: $CI_COMMIT_BRANCH

ruff_check:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ruff --version
    - echo "Checking all Python files"
    - uv run ruff check --output-format=gitlab . > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
    when: always

ruff_format:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ruff --version
    - echo "Formatting all Python files"
    - uv run ruff format --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

pytest:
  extends: .base_uv
  tags:
    - size/medium
  cache:
    <<: *uv_cache
    policy: pull-push
  after_script:
    - uv cache prune --ci
  before_script:
    - !reference [.base_uv, before_script]
    - apt-get update -qq && apt-get install -y --no-install-recommends git jq
  script:
    - echo "Running tox with coverage"
    - uv run tox
  artifacts:
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    when: always

yamllint:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run yamllint --version
    - echo "Running yamllint"
    - |
      uv run yamllint -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' -f parsable . | \
      uv run python tests/helpers/yamllint_to_json.py | tee yamllint-report.json
  artifacts:
    reports:
      codequality: yamllint-report.json
    when: always

kingfisher:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run kingfisher --version
    - echo "Scanning working tree for secrets"
    - uv run kingfisher scan . --git-history none --no-validate --no-update-check --exclude .git --exclude .cache --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type_check:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ty --version
    - echo "Running type checking"
    - uv run ty check
  allow_failure: false

shellcheck:
  stage: build
  interruptible: true
  image:
    name: docker.io/koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  tags:
    - size/medium
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - shellcheck --version
    - echo "Linting all shell scripts"
    - find . -type f -not -path './.git/*' -not -path './.venv/*' -not -path './.tox/*' -exec sh -c 'case "$1" in *.sh) shellcheck "$1";; *) if head -n1 "$1" | grep -Eq "^#!.*(ba)?sh"; then shellcheck "$1"; fi;; esac' _ {} \;
