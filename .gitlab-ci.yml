stages:
  - ci-image
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.ci_image_builder:
  stage: ci-image
  interruptible: true
  image:
    name: docker.io/moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p /tmp/ci-image-context
    - cp Dockerfile pyproject.toml uv.lock /tmp/ci-image-context/
    - mkdir -p "$HOME/.docker"
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$auth" \
        > "$HOME/.docker/config.json"
      unset auth
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=/tmp/ci-image-context \
        --local dockerfile=/tmp/ci-image-context \
        --secret "id=network-ca,src=$CI_SERVER_TLS_CA_FILE" \
        --opt "target=$CI_IMAGE_TARGET" \
        --metadata-file "build-metadata-$CI_IMAGE_TARGET.json" \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/validation-$CI_IMAGE_TARGET-cache" \
        --export-cache "type=registry,ref=$CI_REGISTRY_IMAGE/validation-$CI_IMAGE_TARGET-cache,mode=max" \
        --output "type=image,name=$CI_REGISTRY_IMAGE/validation-$CI_IMAGE_TARGET:$CI_COMMIT_SHA-$CI_PIPELINE_ID,push=true"
    - |
      digest="$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "build-metadata-$CI_IMAGE_TARGET.json")"
      if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          rm -f "ci-image-$CI_IMAGE_TARGET.env"
          exit 2
      fi
      printf '%s=%s/validation-%s@%s\n' \
        "$CI_IMAGE_VARIABLE" "$CI_REGISTRY_IMAGE" "$CI_IMAGE_TARGET" "$digest" \
        > "ci-image-$CI_IMAGE_TARGET.env"
  artifacts:
    reports:
      dotenv: ci-image-$CI_IMAGE_TARGET.env
    paths:
      - build-metadata-$CI_IMAGE_TARGET.json
      - ci-image-$CI_IMAGE_TARGET.env
    when: always

ci-image:tooling:
  extends: .ci_image_builder
  tags:
    - size/medium
  variables:
    CI_IMAGE_TARGET: tooling
    CI_IMAGE_VARIABLE: CI_TOOLING_IMAGE
  before_script:
    - !reference [.ci_image_builder, before_script]

ci-image:pytest-py311:
  extends: .ci_image_builder
  tags:
    - size/medium
  variables:
    CI_IMAGE_TARGET: pytest-py311
    CI_IMAGE_VARIABLE: CI_PY311_IMAGE
  before_script:
    - !reference [.ci_image_builder, before_script]

ci-image:pytest-py314:
  extends: .ci_image_builder
  tags:
    - size/medium
  variables:
    CI_IMAGE_TARGET: pytest-py314
    CI_IMAGE_VARIABLE: CI_PY314_IMAGE
  before_script:
    - !reference [.ci_image_builder, before_script]

.base_uv:
  stage: validate
  interruptible: true
  needs:
    - job: ci-image:tooling
      artifacts: false
  tags:
    - size/medium
  image:
    name: $CI_REGISTRY_IMAGE/validation-tooling:$CI_COMMIT_SHA-$CI_PIPELINE_ID
  before_script:
    - cd "$CI_PROJECT_DIR"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

ruff-check:
  extends: .base_uv
  script:
    - uv run --no-sync ruff check --output-format=gitlab . > ruff-code-quality-report.json
  artifacts:
    reports:
      codequality: ruff-code-quality-report.json
    when: always

ruff-format:
  extends: .base_uv
  script:
    - uv run --no-sync ruff format --check --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

.pytest:
  extends: .base_uv
  script:
    - |
      case "$TEST_ENVIRONMENT" in
          py311) python_environment="$CI_PY311_ENVIRONMENT" ;;
          py314) python_environment="$CI_PY314_ENVIRONMENT" ;;
          *) printf 'Unknown test environment: %s\n' "$TEST_ENVIRONMENT" >&2; exit 2 ;;
      esac
      PYTHONPATH="$CI_PROJECT_DIR:$CI_PROJECT_DIR/src" \
          UV_PROJECT_ENVIRONMENT="$python_environment" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
          --cov=src/agent_work \
          --cov-fail-under=85 \
          --cov-report="xml:coverage-$TEST_ENVIRONMENT.xml" \
          --junitxml="test-results-$TEST_ENVIRONMENT.xml" \
          -o "junit_suite_name=$TEST_ENVIRONMENT" \
          -o "cache_dir=.cache/pytest/$TEST_ENVIRONMENT"
  artifacts:
    reports:
      junit: test-results-$TEST_ENVIRONMENT.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-$TEST_ENVIRONMENT.xml
    paths:
      - coverage-$TEST_ENVIRONMENT.xml
    when: always

pytest-py311:
  extends: .pytest
  needs:
    - job: ci-image:pytest-py311
      artifacts: false
  image:
    name: $CI_REGISTRY_IMAGE/validation-pytest-py311:$CI_COMMIT_SHA-$CI_PIPELINE_ID
  variables:
    TEST_ENVIRONMENT: py311

pytest-py314:
  extends: .pytest
  needs:
    - job: ci-image:pytest-py314
      artifacts: false
  image:
    name: $CI_REGISTRY_IMAGE/validation-pytest-py314:$CI_COMMIT_SHA-$CI_PIPELINE_ID
  variables:
    TEST_ENVIRONMENT: py314

yamllint:
  extends: .base_uv
  script:
    - |
      uv run --no-sync yamllint \
          -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' \
          -f parsable . \
          | uv run --no-sync python tests/helpers/yamllint_to_json.py \
              > yamllint-code-quality-report.json
  artifacts:
    reports:
      codequality: yamllint-code-quality-report.json
    when: always

kingfisher:
  extends: .base_uv
  script:
    - uv run --no-sync kingfisher scan . --git-history none --no-validate --no-update-check --exclude .git --exclude .cache --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type-check:
  extends: .base_uv
  image:
    name: "$CI_REGISTRY_IMAGE/validation-pytest-py311:$CI_COMMIT_SHA-$CI_PIPELINE_ID"
  needs:
    - job: ci-image:pytest-py311
      artifacts: false
  script:
    - uv run --no-sync ty check

license-check:
  extends: .base_uv
  image:
    name: "$CI_REGISTRY_IMAGE/validation-pytest-py311:$CI_COMMIT_SHA-$CI_PIPELINE_ID"
  needs:
    - job: ci-image:pytest-py311
      artifacts: false
  script:
    - uv run --no-sync python scripts/check_licenses.py --root .

readability-check:
  extends: .base_uv
  script:
    - PYTHONPATH="$CI_PROJECT_DIR/src" uv run --no-sync python -m agent_work.readability --root . --scope all

shellcheck:
  extends: .base_uv
  script:
    - |
      file_list=$(mktemp)
      trap 'rm -f "$file_list"' 0 HUP INT TERM
      find . -type f \
          -not -path './.git/*' \
          -not -path './.cache/*' \
          -not -path './.venv/*' \
          -not -path './.tox/*' \
          -not -path './.pytest_cache/*' \
          -not -path './.ruff_cache/*' \
          -print0 > "$file_list"
      status=0
      while IFS= read -r -d '' file; do
          case "$file" in
              *.sh) shellcheck "$file" || status=1 ;;
              *)
                  IFS= read -r first_line < "$file" || true
                  if [[ "$first_line" =~ ^#!.*(ba)?sh ]]; then
                      shellcheck "$file" || status=1
                  fi
                  ;;
          esac
      done < "$file_list"
      exit "$status"
