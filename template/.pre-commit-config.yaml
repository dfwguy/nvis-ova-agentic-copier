repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: "uv run yamllint --config-data='{extends: default, rules: {line-length: disable, document-start: disable}}'"
        language: system
        types: [yaml]
      - id: trailing-whitespace
        name: trailing whitespace
        entry: '[ \t]+$'
        language: pygrep
        types: [text]
        args: [--multiline]
      - id: check-toml
        name: TOML parsing
        entry: "uv run python -c 'import sys, tomllib; from pathlib import Path; [tomllib.loads(Path(path).read_text()) for path in sys.argv[1:]]'"
        language: system
        types: [toml]
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: tox
        name: tox
        entry: uv run tox run-parallel
        language: system
        pass_filenames: false
        types: [python]

      # detect-private-key needs an organization-approved secret scanner.
      # check-illegal-windows-names needs a cross-platform filename policy tool.
      # The two executable/shebang checks need an organization-approved policy
      # for generated and vendored scripts. Ruff already validates Python ASTs.
