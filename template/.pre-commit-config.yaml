repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: "uv run yamllint --config-data='{extends: default, rules: {line-length: disable, document-start: disable}}'"
        language: system
        types: [yaml]
      - id: trailing-whitespace
        name: trailing whitespace
        entry: '[ \t]+$'
        language: pygrep
        types: [text]
        args: [--multiline]
      - id: check-toml
        name: TOML parsing
        entry: "uv run python -c 'import sys, tomllib; from pathlib import Path; [tomllib.loads(Path(path).read_text()) for path in sys.argv[1:]]'"
        language: system
        types: [toml]
      - id: license-check
        name: NVIDIA license policy
        entry: uv run python scripts/check_licenses.py --root .
        language: system
        pass_filenames: false
        always_run: true
      - id: readability-check
        name: Markdown readability
        entry: uv run python -m agent_work.readability --root . --scope all
        language: system
        pass_filenames: false
        always_run: true
      - id: bash-syntax
        name: Bash syntax
        entry: bash -n
        language: system
        types: [shell]
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: kingfisher
        name: Kingfisher secret scan
        entry: uv run kingfisher scan . --staged --no-validate --no-update-check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: tox
        name: tox
        entry: uv run tox run-parallel
        language: system
        pass_filenames: false
        always_run: true
