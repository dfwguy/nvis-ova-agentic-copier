.base_uv:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:0.7.3-bookworm-slim
  before_script:
    - cd $CI_PROJECT_DIR
    - uv --version
  rules:
    - if: $CI_COMMIT_BRANCH

ruff_check:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ruff --version
    - echo "Checking all Python files"
    - uv run ruff check --output-format=gitlab . > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
    when: always

ruff_format:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ruff --version
    - echo "Formatting all Python files"
    - uv run ruff format --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

pytest:
  extends: .base_uv
  tags:
    - size/medium
  before_script:
    - !reference [.base_uv, before_script]
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - uv run tox --version
    - echo "Running tox with coverage"
    - uv run tox
  artifacts:
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    when: always

yamllint:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run yamllint --version
    - echo "Running yamllint"
    - |
      uv run yamllint -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' -f parsable . | \
      uv run python tests/helpers/yamllint_to_json.py | tee yamllint-report.json
  artifacts:
    reports:
      codequality: yamllint-report.json
    when: always

kingfisher:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run kingfisher --version
    - echo "Scanning working tree for secrets"
    - uv run kingfisher scan . --git-history none --no-validate --no-update-check --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type_check:
  extends: .base_uv
  tags:
    - size/medium
  script:
    - uv run ty --version
    - echo "Running type checking"
    - uv run ty check
  allow_failure: false
