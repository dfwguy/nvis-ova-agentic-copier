.uv_cache:
  cache: &uv_cache
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/

.base_uv:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:0.7.3-python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  before_script:
    - cd "$CI_PROJECT_DIR"
    - uv --version
    - apt-get update -qq && apt-get install -y --no-install-recommends git jq shellcheck
    - uv sync --locked --all-groups
  rules:
    - if: $CI_COMMIT_BRANCH

validation:
  extends: .base_uv
  tags:
    - size/medium
  cache:
    <<: *uv_cache
    policy: pull-push
  script:
    - bash tests/helpers/run-ci-checks.sh
  after_script:
    - uv cache prune --ci
  artifacts:
    reports:
      junit:
        - test-results-py311.xml
        - test-results-py314.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py314.xml
      codequality: code-quality-report.json
    paths:
      - ci-logs/
      - format-changes.diff
      - coverage-py311.xml
      - coverage-py314.xml
    when: always
