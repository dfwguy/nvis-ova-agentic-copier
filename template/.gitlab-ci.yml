.uv_cache:
  cache: &uv_cache
    key:
      prefix: uv-0.7.3-py311-py314-v1
      files:
        - uv.lock
        - pyproject.toml
    paths:
      - .cache/uv/
      - .cache/uv-python/

.base_uv:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:0.7.3-python3.11-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/uv-python"
    UV_PYTHON_PREFERENCE: system
  before_script:
    - cd "$CI_PROJECT_DIR"
    - uv --version
    - |
      set -Eeuo pipefail
      apt_status=0
      python_status=0

      uv python install 3.14 &
      python_install_pid=$!

      apt-get update -qq \
          && apt-get install -y --no-install-recommends git jq shellcheck \
          || apt_status=$?

      wait "$python_install_pid" || python_status=$?

      if (( apt_status != 0 )); then
          exit "$apt_status"
      fi
      if (( python_status != 0 )); then
          exit "$python_status"
      fi
    - uv sync --locked --all-groups
  rules:
    - if: $CI_COMMIT_BRANCH

validation:
  extends: .base_uv
  tags:
    - size/medium
  cache:
    <<: *uv_cache
    policy: pull-push
  script:
    - bash tests/helpers/run-ci-checks.sh
  after_script:
    - uv cache prune --ci
  artifacts:
    reports:
      junit:
        - test-results-py311.xml
        - test-results-py314.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py314.xml
      codequality: code-quality-report.json
    paths:
      - ci-logs/
      - format-changes.diff
      - coverage-py311.xml
      - coverage-py314.xml
    when: always
