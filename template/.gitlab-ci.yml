stages:
  - validate

.base_job:
  stage: validate
  interruptible: true
  tags:
    - size/medium
  rules:
    - if: $CI_COMMIT_BRANCH

.base_uv:
  extends: .base_job
  image:
    name: ghcr.io/astral-sh/uv:0.9.30-python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  before_script:
    - &ci_project_directory cd "$CI_PROJECT_DIR"
    - &uv_version uv --version

.base_py311:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" uv sync --locked --all-groups --python 3.11 --no-managed-python

ruff-check:
  extends: .base_py311
  script:
    - uv run --no-sync ruff check --output-format=gitlab . > ruff-code-quality-report.json
  artifacts:
    reports:
      codequality: ruff-code-quality-report.json
    when: always

ruff-format:
  extends: .base_py311
  script:
    - uv run --no-sync ruff format --check --diff . > format-changes.diff
  artifacts:
    paths:
      - format-changes.diff
    when: always

pytest-py311:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - apt-get update -qq && apt-get install -y --no-install-recommends git jq
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" uv sync --locked --all-groups --python 3.11 --no-managed-python
  script:
    - |
      COVERAGE_FILE=".coverage.py311" \
          UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
              --cov \
              --cov-fail-under=85 \
              --cov-report=xml:coverage-py311.xml \
              --junitxml=test-results-py311.xml \
              -o junit_suite_name=py311 \
              -o cache_dir=.cache/pytest/py311
  artifacts:
    reports:
      junit: test-results-py311.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py311.xml
    when: always

pytest-py314:
  extends: .base_uv
  before_script:
    - *ci_project_directory
    - *uv_version
    - |
      set -Eeuo pipefail
      apt_status=0
      python_status=0

      uv python install 3.14.3 --managed-python &
      python_install_pid=$!

      apt-get update -qq \
          && apt-get install -y --no-install-recommends git jq \
          || apt_status=$?

      wait "$python_install_pid" || python_status=$?

      if (( apt_status != 0 )); then
          exit "$apt_status"
      fi
      if (( python_status != 0 )); then
          exit "$python_status"
      fi
    - UV_PROJECT_ENVIRONMENT="/tmp/ci-venvs/py314" uv sync --locked --all-groups --python 3.14.3 --managed-python
  script:
    - |
      COVERAGE_FILE=".coverage.py314" \
          UV_PROJECT_ENVIRONMENT="/tmp/ci-venvs/py314" \
          uv run --no-sync env -u UV_PROJECT_ENVIRONMENT pytest \
              --cov \
              --cov-fail-under=85 \
              --cov-report=xml:coverage-py314.xml \
              --junitxml=test-results-py314.xml \
              -o junit_suite_name=py314 \
              -o cache_dir=.cache/pytest/py314
  artifacts:
    reports:
      junit: test-results-py314.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-py314.xml
    when: always

yamllint:
  extends: .base_py311
  script:
    - |
      uv run --no-sync yamllint \
          -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable"}}' \
          -f parsable . \
          | uv run --no-sync python tests/helpers/yamllint_to_json.py \
              > yamllint-code-quality-report.json
  artifacts:
    reports:
      codequality: yamllint-code-quality-report.json
    when: always

kingfisher:
  extends: .base_py311
  script:
    - uv run --no-sync kingfisher scan . --git-history none --no-validate --no-update-check --exclude .git --exclude .cache --exclude .venv --exclude .tox --exclude .pytest_cache --exclude .ruff_cache

type-check:
  extends: .base_py311
  script:
    - uv run --no-sync ty check

shellcheck:
  extends: .base_job
  image:
    name: docker.io/koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    entrypoint: [""]
  script:
    - shellcheck --version
    - echo "Linting all shell scripts"
    - |
      file_list=$(mktemp)
      trap 'rm -f "$file_list"' 0 HUP INT TERM
      if ! find . -type f \
          -not -path './.git/*' \
          -not -path './.cache/*' \
          -not -path './.venv/*' \
          -not -path './.tox/*' \
          -not -path './.pytest_cache/*' \
          -not -path './.ruff_cache/*' \
          -print0 > "$file_list"; then
          exit 1
      fi
      xargs -0 -r sh -c '
          status=0
          for file do
              case "$file" in
                  *.sh)
                      shellcheck "$file" || status=1
                      ;;
                  *)
                      if head -n1 "$file" | grep -Eq "^#!.*(ba)?sh"; then
                          shellcheck "$file" || status=1
                      fi
                      ;;
              esac
          done
          exit "$status"
      ' _ < "$file_list"
